name: CI
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ronghub_owner
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ronghub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ronghub_owner -d ronghub"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://ronghub_owner:ci-only-password@localhost:5432/ronghub
      DEMO_MODE: 'true'
      SMS_MODE: demo
      STORAGE_PATH: /tmp/ronghub-ci-files
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run alembic upgrade head
      - run: uv run python -m app.export_contract
      - run: uv run pytest -q
  web:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://unused:unused@localhost/ronghub
      DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: uv sync --frozen --directory apps/server
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web api:generate
      - run: git diff --exit-code -- packages/api-client/schema.d.ts
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web build
