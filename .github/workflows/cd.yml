name: Deploy demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ronghub-demo-deployment
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [server, web]
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          app="${{ matrix.app }}"
          name=ronghub-web
          if [ "$app" = server ]; then name=ronghub-api; fi
          echo "name=ghcr.io/$owner/$name:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}
          build-args: API_ORIGIN=http://ronghub-edge:8080
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
  deploy:
    needs: [ci, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ vars.SSH_FINGERPRINT }}
          source: deploy/traefik.compose.yml,deploy/nginx.traefik.conf,deploy/cloud_deploy.py,deploy/postgres,scripts/stack_ops.py
          target: ronghub/
      - uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_OWNER: ${{ github.repository_owner }}
          TAG: sha-${{ github.sha }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ vars.SSH_FINGERPRINT }}
          envs: GHCR_TOKEN,GHCR_USER,GHCR_OWNER,TAG
          command_timeout: 20m
          script: |
            set -eu
            export DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            unset GHCR_TOKEN
            cd ~/ronghub
            python3 deploy/cloud_deploy.py "$TAG"
      - name: Verify public DNS and HTTPS
        run: |
          for route in /api/v1/health / /portal /portal/login; do
            curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 --connect-timeout 10 --max-time 20 --output /dev/null "https://ronghub.asksquirrel.ai$route"
          done
