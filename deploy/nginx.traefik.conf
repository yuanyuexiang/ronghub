pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  map $http_x_forwarded_proto $forwarded_proto { default $scheme; https https; http http; }
  map $http_x_forwarded_for $forwarded_for { default $http_x_forwarded_for; "" $remote_addr; }
  server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64m;
    client_body_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location /api/v1/ {
      set $api_upstream ronghub-api:8000;
      proxy_pass http://$api_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location / {
      set $web_upstream ronghub-web:3000;
      proxy_pass http://$web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
  }
}
