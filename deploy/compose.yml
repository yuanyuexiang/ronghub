name: ronghub
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ronghub
      POSTGRES_USER: ronghub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - ronghub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ronghub -d ronghub"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  ronghub_pg:
