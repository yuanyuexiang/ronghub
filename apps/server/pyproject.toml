[project]
name = "ronghub-server"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.5,<3",
    "pwdlib[argon2]>=0.2,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.33",
    "pillow>=12,<13",
    "xlsxwriter>=3.2,<4",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["captcha_manual: exercise explicit challenge handling without automatic test setup"]
[tool.ruff]
line-length = 100
